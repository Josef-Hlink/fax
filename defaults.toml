[PATHS]
iso = "$XDG_DEVELOPER_DIR/own/fax/data/Super Smash Bros. Melee (USA) (En,Ja) (v1.02).iso"
exe = "$XDG_DEVELOPER_DIR/own/fax/data/Slippi_Online-x86_64-ExiAI.AppImage"
zips = "/data/zips/ranked-anonymized-*.zip"  # 1-3
sql = "$XDG_DEVELOPER_DIR/own/fax/data/index.db"
mds = "$XDG_DEVELOPER_DIR/own/fax/data/mds/"
logs = "$XDG_DEVELOPER_DIR/own/fax/data/logs/"
weights = "$XDG_DEVELOPER_DIR/own/fax/data/weights/"
replays = "$XDG_DEVELOPER_DIR/own/fax/data/replays/"
dolphin-home = "~/.config/SlippiPlayback/"
[BASE]
seed = 42
debug = false
wandb = false
n-gpus = 1
[MODEL]
n-layers = 4
n-heads = 8
seq-len = 256
emb-dim = 256
dropout = 0.1
gamma = 0.999
[OPTIM]
lr = 3e-4
wd = 1e-2
b1 = 0.9
b2 = 0.999
[TRAINING]
batch-size = 64
n-epochs = 100
n-samples = 16_384  # 2^14
n-val-samples = 2_048  # 2^11
n-dataworkers = 8
matchup = "FvF"
n-finetune-epochs = 10
finetune-lr-frac = 0.5
both-perspectives = false
[EVAL]
p1-type = "1k-FvF-ft"
p1-run = ""
p2-type = "cpu"
p2-run = ""
n-loops = 5
n-workers = 2
ffw = false
character = "FOX"
temperature = 1.0
